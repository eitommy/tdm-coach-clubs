<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error inesperado · TDM Coach</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8f9fa;
            color: #212529;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: min(560px, 100%);
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }
        p {
            color: #6c757d;
            line-height: 1.5;
            margin: 0 0 24px;
        }
        a {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            background: #2563EB;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">⚠️</div>
        <h1>Ocurrió un error inesperado</h1>
        <p>
            No pudimos completar la operación.
            Intentá nuevamente en unos minutos.
        </p>
        <a href="/">Volver al inicio</a>
    </main>
</body>
</html>
